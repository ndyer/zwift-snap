# PulseAudio client configuration for the snap (same as the upstream docker image).
# The server is the host's pulseaudio or pipewire-pulse, reached through the
# audio-playback interface. See PULSE_SERVER in wine-env.sh.

# Prevent a server running in the snap
autospawn = no
daemon-binary = /bin/true

# Prevent the use of shared memory
enable-shm = false
