[package]
name = "zwsnap-gui"
version = "0.1.0"
edition = "2021"
description = "Rust replacement for the Zwift snap launcher scripts and yad dialogs"
license = "MIT OR Apache-2.0"

[lib]
name = "zwsnap_gui"
path = "src/lib.rs"

[[bin]]
name = "zwsnap-gui"
path = "src/main.rs"

[dependencies]
libc = "0.2"
signal-hook = "0.3"
gtk = { package = "gtk4", version = "0.9", optional = true }
webkit6 = "0.4"
ureq = "2.9.0"
base64 = "0.21.5"
sha2 = "0.10.0"
serde_json = "1.0"
getrandom = "0.2"
urlencoding = "2.1"
# The update XML is parsed with a real XML parser rather than string matching:
# manifests are remote input and the paths they carry are used as filesystem paths.
roxmltree = "0.20"
# Manifest checksums are CRC-32, verified while the file is being written.
crc32fast = "1.4"
# Percent-encoding of individual URL path components; `urlencoding` cannot be used
# per component because it also escapes `.` and `-`.
percent-encoding = "2.3"
# The graphics profile check loads EGL at runtime, so these stay optional in
# practice: a missing libEGL or driver only disables the measurement.
glow = "0.18"
glutin_egl_sys = "0.7"
libloading = "0.9"

[features]
gtk-ui = ["dep:gtk"]

[workspace]
