name: zwift
title: Zwift
summary: Launch Zwift on Linux using Wine
description: |
  Unofficial snap launcher for Zwift

  Zwift itself is proprietary and is NOT part of this snap. Every start checks
  for a Zwift installation and updates it and its pre-requisites. The graphical
  launcher then requires login through an embedded browser before starting Zwift.
# The version comes from the git tags, see the version-generator part
adopt-info: version-generator
license: MIT OR Apache-2.0
contact: https://github.com/ndyer/zwift-snap/issues
website: https://github.com/ndyer/zwift-snap
base: core26
grade: devel
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

lint:
  ignore:
    # nss modules that libnss3 dlopens by name when initializing its crypto
    # backends, kept by snap/prune-closure.sh for exactly that reason
    - library:
        - usr/lib/x86_64-linux-gnu/libsoftokn3.so
        - usr/lib/x86_64-linux-gnu/libfreeblpriv3.so
        - usr/lib/x86_64-linux-gnu/libfreebl3.so
        - usr/lib/x86_64-linux-gnu/libnssdbm3.so
        - usr/lib/x86_64-linux-gnu/libnssckbi.so
    # libenchant-2-2 (WebKit's spellcheck) dlopens these aspell/hunspell
    # plugins. Their libraries are not staged and no dictionaries ship, so
    # spellcheck is unavailable in the snap and the plugins are inert.
    - library:
        - usr/lib/aspell/x86_64-linux-gnu/context-filter.so
        - usr/lib/aspell/x86_64-linux-gnu/ddtp-filter.so
        - usr/lib/aspell/x86_64-linux-gnu/debctrl-filter.so
        - usr/lib/aspell/x86_64-linux-gnu/email-filter.so
        - usr/lib/aspell/x86_64-linux-gnu/markdown-filter.so
        - usr/lib/aspell/x86_64-linux-gnu/nroff-filter.so
        - usr/lib/aspell/x86_64-linux-gnu/sgml-filter.so
        - usr/lib/aspell/x86_64-linux-gnu/tex-filter.so
        - usr/lib/aspell/x86_64-linux-gnu/texinfo-filter.so
        - usr/lib/x86_64-linux-gnu/enchant-2/enchant_aspell.so
        - usr/lib/x86_64-linux-gnu/enchant-2/enchant_hunspell.so

plugs:
  gpu-2604:
    interface: content
    target: $SNAP/gpu-2604
    default-provider: mesa-2604

layout:
  # GTK image loading uses glycin, which starts its loader programs by the
  # absolute paths in its configuration files. The base has neither directory, so they can
  # be bind mounts.
  /usr/libexec/glycin-loaders:
    bind: $SNAP/usr/libexec/glycin-loaders
  /usr/share/glycin-loaders:
    bind: $SNAP/usr/share/glycin-loaders
  # WebKit spawns its network/web/GPU processes and loads its injected bundle
  # using compiled-in absolute paths, not PATH or LD_LIBRARY_PATH.
  /usr/lib/x86_64-linux-gnu/webkitgtk-6.0:
    bind: $SNAP/usr/lib/x86_64-linux-gnu/webkitgtk-6.0

environment:
  # wine and the launcher look for helper programs (cabextract, ntlm_auth) in PATH
  PATH: $SNAP/bin:$SNAP/usr/bin:$SNAP/usr/sbin:$PATH
  # keyboard layout data for wine's wayland driver (libxkbcommon)
  XKB_CONFIG_ROOT: $SNAP/usr/share/X11/xkb

apps:
  zwift:
    command: bin/zwsnap-gui
    command-chain: &chain
      - bin/gpu-2604-wrapper
      - bin/wine-env.sh
    # The zwift app hosts the opt-in BLE connection-interval helper, so it alone
    # requests bluetooth-control. That interface is deny-auto-connection: it is
    # never connected unless the user runs `snap connect zwift:bluetooth-control`,
    # keeping the privileged socket access strictly opt-in.
    plugs:
      - audio-playback
      - bluez
      - bluetooth-control
      - desktop
      - desktop-legacy
      - network
      - network-bind
      - network-status
      - opengl
      - screen-inhibit-control
      - wayland
      - x11
  wine:
    command: opt/wine-devel/bin/wine
    command-chain: *chain
    plugs: &plugs
      - audio-playback
      - bluez
      - desktop
      - desktop-legacy
      - network
      - network-bind
      - network-status
      - opengl
      - wayland
      - x11
  winecfg:
    command: opt/wine-devel/bin/wine winecfg
    command-chain: *chain
    plugs: *plugs

parts:
  zwsnap-gui:
    plugin: rust
    source: zwsnap-gui
    rust-channel: stable
    rust-features: [gtk-ui]
    build-packages:
      - libgtk-4-dev
      - libwebkitgtk-6.0-dev
      - libjavascriptcoregtk-6.0-dev
      - libsoup-3.0-dev
      # glib-compile-resources, run by zwsnap-gui/build.rs to compile the bundled
      # icon set into the binary (it no longer uses a system icon theme).
      - libglib2.0-bin
    stage-packages:
      - libgtk-4-1
      - libwebkitgtk-6.0-4
      - libjavascriptcoregtk-6.0-1
      - libsoup-3.0-0
      # TLS is a GIO plugin, not a linked dependency of WebKit/libsoup.
      - glib-networking
    prime:
      - bin/zwsnap-gui
      - usr/

  wine:
    # Built from ndyer/wine, a fork of the official wine-mirror/wine GitHub
    # mirror of gitlab.winehq.org/wine/wine.
    #
    # This uses the zwift-radios-rebased branch which contains BLE support
    # (Bluetooth LE advertisement watcher, GATT operations, Windows.Devices.Radios)
    # rebased on top of wine-11.21.
    # Using local source for faster incremental builds.
    plugin: autotools
    source: /project/wine-src
    source-type: local
    # wine ships a configure script, so the plugin goes straight to
    # configure/make/make install. 64-bit only: the game and the shipped
    # Windows helpers are all x86_64, so no i386 PE tree is built.
    autotools-configure-parameters:
      # the launcher scripts and the snap apps expect this exact prefix
      - --prefix=/opt/wine-devel
      - --enable-archs=x86_64
      # nothing in the snap runs wine's test suite
      - --disable-maintainer-mode
      - --disable-debug
      - --disable-tests
      - --disable-build-id
      # Only build the DLLs and programs Zwift needs: every other
      # dlls/ and programs/ subdirectory is switched off with its
      # enable_<name>=no configure assignment. Setting the variable adds
      # the directory to configure's DISABLED_SUBDIRS, so makedep skips it
      # entirely - it is neither built nor installed, and its PE file
      # never lands in the snap.
      #
      # The keep set (what is NOT disabled below) was derived from:
      #  - a WINEDEBUG=+loaddll trace of a full Zwift session (the DLLs
      #    wine actually loaded),
      #  - the static import tables and .spec forwarders of every
      #    kept module (transitive closure),
      #  - the DELAYIMPORTS targets of every kept module: a
      #    delay-load that fires on a missing dll aborts the whole
      #    wine process (ZwiftApp died on cryptnet.dll
      #    .CryptGetObjectUrl, which crypt32 delay-loads during root
      #    certificate store enumeration), so delay imports need
      #    closing too, not just static imports,
      #  - dynamic loads from kept code (msi -> riched20/fusion/advpack/
      #    cabinet, oleaut32 -> stdole2.tlb, winmm -> msacm32.drv,
      #    urlmon -> advpack),
      #  - a unixlib audit, which catches drivers wine loads as .so
      #    Unix libraries and the loaddll trace does not show
      #    (winealsa/winepulse/wineoss audio, winebth, winebus),
      #  - the import tables of Zwift's own binaries: apisetschema (the
      #    unix loader maps it into every process to resolve the
      #    api-ms-* imports of ZwiftApp.exe and BleWin10Lib.dll),
      #    msvcp140/vcruntime140/vcruntime140_1/vccorlib140
      #    (BleWin10Lib.dll's C++ runtime - Zwift ships no native
      #    copies), and the tasklist/taskkill programs the launcher
      #    runs to manage Zwift's background tasks,
      #  - wineboot's first-run prefix bootstrap, which the trace
      #    misses because the prefix already existed during it:
      #    wineboot runs rundll32.exe on wine.inf (PreInstall /
      #    DefaultInstall) and delay-loads newdev.dll to install
      #    the root device drivers (winebth/winebus/wineusb), so
      #    rundll32 and newdev stay built.
      #  - the dlls wine loads by a name baked into its own source
      #    rather than an import, which the closure above cannot see:
      #    grep the wine source for LoadLibraryW( L"..."). setupapi's
      #    register_fake_dll is the one that bites. While processing
      #    wine.inf it LoadLibrary("atl100.dll") and calls
      #    AtlCreateRegistrar to register every fake dll's
      #    WINE_REGISTRY resources, and when atl100 is missing it bails
      #    out of the registration entirely: the prefix is left
      #    half-built and ZwiftApp exits before its window ever appears.
      #    atl100, gameinput, windows.media.speech, wmadmod and wpcap
      #    therefore stay built.
      # To regenerate: recompute keep = trace + closure, disable = all
      # dirs - keep, and map each disabled dir to its enable_* variable
      # via the wine_fn_config_makefile lines in wine's configure.
      - enable_acledit=no
      - enable_aclui=no
      - enable_activeds=no
      - enable_activeds_tlb=no
