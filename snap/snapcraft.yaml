name: zwift
title: Zwift
summary: Run Zwift on Linux using wine
description: |
  Unofficial snap packaging of Zwift for Linux

  Zwift itself is proprietary and is NOT part of this snap.

  Every start checks for a Zwift installation and updates it and its pre-requisites
  before Zwift starts. Log in through the Zwift window.
# The version comes from the git tags, see the version-generator part
adopt-info: version-generator
license: Unlicense
contact: https://github.com/ndyer/zwift-snap/issues
website: https://github.com/ndyer/zwift-snap
base: core26
grade: devel
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

lint:
  ignore:
    # nss modules that libnss3 dlopens by name when initializing its crypto
    # backends, kept by snap/prune-closure.sh for exactly that reason
    - library:
        - usr/lib/x86_64-linux-gnu/libsoftokn3.so
        - usr/lib/x86_64-linux-gnu/libfreeblpriv3.so
        - usr/lib/x86_64-linux-gnu/libfreebl3.so
        - usr/lib/x86_64-linux-gnu/libnssdbm3.so
        - usr/lib/x86_64-linux-gnu/libnssckbi.so

plugs:
  gpu-2604:
    interface: content
    target: $SNAP/gpu-2604
    default-provider: mesa-2604

layout:
  # GTK image loading uses glycin, which starts its loader programs by the
  # absolute paths in its configuration files. The base has neither directory, so they can
  # be bind mounts.
  /usr/libexec/glycin-loaders:
    bind: $SNAP/usr/libexec/glycin-loaders
  /usr/share/glycin-loaders:
    bind: $SNAP/usr/share/glycin-loaders

environment:
  # winetricks and wine look for helper programs (cabextract, ntlm_auth) in PATH
  PATH: $SNAP/bin:$SNAP/usr/bin:$SNAP/usr/sbin:$PATH
  # keyboard layout data for wine's wayland driver (libxkbcommon)
  XKB_CONFIG_ROOT: $SNAP/usr/share/X11/xkb

apps:
  zwift:
    command: bin/zwift-gui
    command-chain: &chain
      - bin/gpu-2604-wrapper
      - bin/wine-env.sh
    plugs: &plugs
      - audio-playback
      - bluez
      - desktop
      - desktop-legacy
      - network
      - network-bind
      - opengl
      - wayland
      - x11
  wine:
    command: opt/wine-devel/bin/wine
    command-chain: *chain
    plugs: *plugs
  winecfg:
    command: opt/wine-devel/bin/wine winecfg
    command-chain: *chain
    plugs: *plugs

parts:
  zwift-gui:
    plugin: rust
    source: launcher-gui
    rust-channel: stable
    rust-features: [gtk-ui]
    build-packages:
      - libgtk-4-dev
    stage-packages:
      - libgtk-4-1
    prime:
      - bin/zwift-gui
      - usr/

  wine:
    # Built from ndyer/wine, a fork of the official wine-mirror/wine GitHub
    # mirror of gitlab.winehq.org/wine/wine.
    #
    # This uses the zwift-radios-rebased branch which contains BLE support
    # (Bluetooth LE advertisement watcher, GATT operations, Windows.Devices.Radios)
    # rebased on top of wine-11.21.
    # Using local source for faster incremental builds.
    plugin: autotools
    source: /project/wine-src
    source-type: local
    # wine ships a configure script, so the plugin goes straight to
    # configure/make/make install. New style WoW64: 64-bit unix libraries plus
    # i386 and x86_64 PE files in one tree, like the WineHQ package.
    autotools-configure-parameters:
      # the launcher scripts and the snap apps expect this exact prefix
      - --prefix=/opt/wine-devel
      - --enable-archs=i386,x86_64
      # nothing in the snap runs wine's test suite
      - --disable-tests
    build-packages:
      # flex, bison, gettext, pkg-config: build requirements of wine itself
      - flex
      - bison
      - gettext
      - pkg-config
      # mingw cross compilers for the PE (Windows) side of the WoW64 build
      - gcc-mingw-w64-i686
      - gcc-mingw-w64-x86-64
      # glib-compile-schemas, see override-prime
      - libglib2.0-bin
      # readelf for snap/prune-closure.sh, see override-prime
      - binutils
      # libraries wine builds against (the runtime libraries themselves come
      # from stage-packages below)
      - libx11-dev
      - libxext-dev
      - libxrandr-dev
      - libxi-dev
      - libxcursor-dev
      - libxinerama-dev
      - libxcomposite-dev
      - libxfixes-dev
      - libxrender-dev
      - libxxf86vm-dev
      - libxkbcommon-dev
      - libxkbregistry-dev
      - libwayland-dev
      - libvulkan-dev
      - libgl-dev
      - libegl-dev
      - libfreetype-dev
      - libfontconfig-dev
      - libgnutls28-dev
      - libpulse-dev
      - libasound2-dev
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
      - libudev-dev
      - libusb-1.0-0-dev
      - libsdl2-dev
      - libkrb5-dev
      - libv4l-dev
      - libpcap-dev
      - libdbus-1-dev
      - libpcsclite-dev
      - libcups2-dev
      - libsane-dev
      - libgphoto2-dev
      - libosmesa6-dev
      - libopenal-dev
      - libcapi20-dev
      - libcups2-dev
    # The runtime libraries that the wine-devel package used to pull in as
    # dependencies, now listed directly (derived from the Depends/Recommends of
    # that package, checked against the DT_NEEDED of the built libraries).
    stage-packages:
      - libasound2t64
      - libasound2-plugins
      - libavcodec62
      - libavformat62
      - libavutil60
      - libcups2t64
      - libdbus-1-3
      - libfontconfig1
      - libfreetype6
      - libglib2.0-0t64
      - libglu1-mesa
      - libgnutls30t64
      - libgphoto2-6t64
      - libgphoto2-port12t64
      - libgssapi-krb5-2
      - libgstreamer-plugins-base1.0-0
      - libgstreamer1.0-0
      - libkrb5-3
      - libncurses6
      - libodbc2
      - libpcap0.8t64
      - libpcsclite1
      - libcapi20-3t64
      - libpulse0
      - libsane1
      - libsdl2-2.0-0
      - libudev1
      - libusb-1.0-0
      - libv4l-0
      - libwayland-client0
      - libwayland-egl1
      - libx11-6
      - libxcomposite1
      - libxcursor1
      - libxext6
      - libxfixes3
      - libxi6
      - libxinerama1
      - libxkbcommon0
      - libxkbregistry0
      - libxrandr2
      - libxrender1
      - libxxf86vm1
      - ocl-icd-libopencl1
      # needed by winetricks
      - cabextract
      - ca-certificates
      - unzip
      - wget
      # ntlm_auth, required by zwift/wine
      - winbind
      # h264 decoding in video routes (wine needs h264parse)
      - gstreamer1.0-libav
      - gstreamer1.0-plugins-bad
      # wayland client-side window decorations
      - libdecor-0-0
      - libdecor-0-plugin-1-gtk
      - xdg-utils
      # keyboard layouts, without them wine's wayland driver gets no keyboard input
      - xkb-data
    # Prune files that are not needed at runtime. Do not prune usr/lib/*/samba, it
    # holds libraries that ntlm_auth needs.
    prime:
      - -usr/share/man
      - -usr/share/info
      - -usr/share/lintian
      - -usr/share/locale
      # sane scanner backends, only pulled in because wine links against libsane
      - -usr/lib/*/sane
      # make install (the autotools plugin runs the plain target, not
      # install-lib) puts wine's C headers and WineHQ's build toolchain into the
      # install tree. Nothing here is used at runtime.
      - -opt/wine-devel/include
      # wine ships the complete build toolchain and static import libraries
      # for cross-compiling Windows programs. Nothing here is used at runtime and
      # the 776 *.a import libraries alone are ~100 MB. The PE files in the same
      # directories ARE needed (new style WoW64 builtin DLLs) and stay.
      - -opt/wine-devel/lib/wine/i386-windows/*.a
      - -opt/wine-devel/lib/wine/x86_64-windows/*.a
      - -opt/wine-devel/lib/wine/x86_64-unix/*.a
      - -opt/wine-devel/share/man
      - -opt/wine-devel/bin/widl
      - -opt/wine-devel/bin/winebuild
      - -opt/wine-devel/bin/winegcc
      - -opt/wine-devel/bin/wineg++
      - -opt/wine-devel/bin/winecpp
      - -opt/wine-devel/bin/winemaker
      - -opt/wine-devel/bin/wmc
      - -opt/wine-devel/bin/wrc
      - -opt/wine-devel/bin/winedump
      - -opt/wine-devel/bin/msidb
      - -opt/wine-devel/bin/function_grep.pl
      # games, not needed by the launcher or winetricks
      - -opt/wine-devel/bin/winemine

  runtime-prune:
    # Pruning needs every runtime part primed, not rebuilt. Keep this dependency
    # downstream of Wine so launcher changes never invalidate Wine's build.
    plugin: nil
    after: [wine, zwift-gui, launcher-runtime, winetricks, runfromprocess]
    override-prime: |
      craftctl default
      # Deletes tools, import libraries and unreachable libraries; see
      # snap/prune-closure.sh for the closure walk. Bump this comment after
      # editing that script or Wine's prime filters, craft-parts only
      # re-runs the prime step when the script text tracked in the part state
      # changes: v7
      # The gschemas.compiled that Debian creates in a trigger is not part of the staged
      # packages. Without it GTK programs abort with "No GSettings schemas are installed".
      glib-compile-schemas "${CRAFT_PRIME}/usr/share/glib-2.0/schemas"
      # keep the copyright files for license compliance, drop the rest of the package docs
      find "${CRAFT_PRIME}/usr/share/doc" -mindepth 2 ! -name copyright \( -type f -o -type l \) -delete
      find "${CRAFT_PRIME}/usr/share/doc" -mindepth 1 -type d -empty -delete
      # Remove the wine build toolchain and the static import libraries. The prime
      # filters above prevent them from being primed on a clean build, but the deletion
      # here is still needed: an incremental prime does not remove files that an older
      # build already put into the prime directory, so they would linger in the snap.
      rm -f "${CRAFT_PRIME}"/opt/wine-devel/lib/wine/*/*.a
      rm -f "${CRAFT_PRIME}"/opt/wine-devel/bin/widl \
            "${CRAFT_PRIME}"/opt/wine-devel/bin/winebuild \
            "${CRAFT_PRIME}"/opt/wine-devel/bin/winegcc \
            "${CRAFT_PRIME}"/opt/wine-devel/bin/wineg++ \
            "${CRAFT_PRIME}"/opt/wine-devel/bin/winecpp \
            "${CRAFT_PRIME}"/opt/wine-devel/bin/winemaker \
            "${CRAFT_PRIME}"/opt/wine-devel/bin/wmc \
            "${CRAFT_PRIME}"/opt/wine-devel/bin/wrc \
            "${CRAFT_PRIME}"/opt/wine-devel/bin/winedump \
            "${CRAFT_PRIME}"/opt/wine-devel/bin/msidb \
            "${CRAFT_PRIME}"/opt/wine-devel/bin/function_grep.pl \
            "${CRAFT_PRIME}"/opt/wine-devel/bin/winemine
      rm -rf "${CRAFT_PRIME}/opt/wine-devel/share/man"
      # Delete every library that nothing in the snap needs at runtime. The
      # script walks the DT_NEEDED closure of wine and the launcher helpers
      # and removes the unreachable libraries from the staged dependency
      # closure, for example the onnxruntime/tensorflow stack that only the
      # gstreamer neural network plugins use.
      "${CRAFT_PROJECT_DIR}/snap/prune-closure.sh" "${CRAFT_PRIME}"
      # Guard against over-pruning: fail the build when anything the launcher, winetricks
      # or wine itself needs at runtime went missing, for example after a change to the
      # stage-packages list or the prime filter above.
      for f in \
          bin/zwift-gui \
          opt/wine-devel/bin/wine \
          opt/wine-devel/bin/wineserver \
          opt/wine-devel/bin/wineboot \
          opt/wine-devel/bin/winecfg \
          opt/wine-devel/bin/winepath \
          opt/wine-devel/bin/msiexec \
          opt/wine-devel/bin/regedit \
          opt/wine-devel/bin/regsvr32 \
          opt/wine-devel/bin/notepad \
          opt/wine-devel/share/wine/wine.inf \
          opt/wine-devel/lib/wine/x86_64-unix/ntdll.so \
          usr/bin/ntlm_auth \
          usr/bin/cabextract \
          usr/bin/unzip \
          usr/bin/wget \
          usr/share/X11/xkb \
          usr/lib/x86_64-linux-gnu/gstreamer-1.0 \
          ; do
          if [[ ! -e "${CRAFT_PRIME}/${f}" ]]; then
              echo "prune guard: ${f} is missing from the prime directory" >&2
              exit 1
          fi
      done
      # the WoW64 PE trees must both exist and still contain the builtin DLLs
      for d in i386-windows x86_64-windows; do
          if [[ ! -d "${CRAFT_PRIME}/opt/wine-devel/lib/wine/${d}" ]] \
              || [[ -z "$(ls -A "${CRAFT_PRIME}/opt/wine-devel/lib/wine/${d}")" ]]; then
              echo "prune guard: lib/wine/${d} is empty or missing" >&2
              exit 1
          fi
      done
      # Guard against stale prime directories: when these build-time-only files are
      # still present the prime directory was not regenerated and the snap would keep
      # shipping them. Run "snapcraft clean" and rebuild in that case.
      for f in \
          bin/zwift-common.sh \
          bin/zwift-gui.sh \
          bin/zwift-run.sh \
          bin/zwift-setup.sh \
          usr/bin/yad \
          opt/wine-devel/bin/widl \
          opt/wine-devel/bin/winebuild \
          opt/wine-devel/bin/winegcc \
          opt/wine-devel/bin/winemaker \
          opt/wine-devel/bin/wmc \
          opt/wine-devel/bin/wrc \
          opt/wine-devel/bin/winedump \
          ; do
          if [[ -e "${CRAFT_PRIME}/${f}" ]]; then
              echo "prune guard: ${f} is a build-time-only file and must not be primed" >&2
              exit 1
          fi
      done

  winetricks:
    plugin: nil
    source: https://raw.githubusercontent.com/Winetricks/winetricks/f3890f670867b5ffbc3938726db45c0f7d16c8ba/src/winetricks
    source-type: file
    source-checksum: sha256/672a1ff4442e8691a3ffc0e6860137e201a1d1227e9b3044245f1731e9e9837e
    override-build: |
      install -Dm755 "${CRAFT_PART_SRC}/winetricks" "${CRAFT_PART_INSTALL}/bin/winetricks"

  runfromprocess:
    # Windows helper that starts ZwiftApp.exe with the launcher as parent process.
    # Ubuntu has no rust windows target packaged, so use rustup for the cross compile.
    plugin: nil
    source: https://github.com/quietvoid/runfromprocess-rs.git
    source-type: git
    source-commit: a3d003c07d1bd11ff93c4cac96d2c3aa5deb8471
    build-packages:
      - ca-certificates
      - curl
      # host linker and C runtime objects (crti.o, Scrt1.o), cargo needs them for build scripts
      - gcc
      - libc6-dev
      - gcc-mingw-w64-x86-64
    override-build: |
      export RUSTUP_HOME="${CRAFT_PART_BUILD}/.rustup"
      export CARGO_HOME="${CRAFT_PART_BUILD}/.cargo"
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --profile minimal --default-toolchain 1.85.0 --target x86_64-pc-windows-gnu
      "${CARGO_HOME}/bin/cargo" build --target x86_64-pc-windows-gnu --release
      install -Dm755 target/x86_64-pc-windows-gnu/release/runfromprocess-rs.exe \
        "${CRAFT_PART_INSTALL}/bin/runfromprocess-rs.exe"

  launcher-runtime:
    plugin: dump
    source: launcher
    build-packages:
      - gcc-mingw-w64-x86-64
    override-build: |
      craftctl default
      mkdir -p "${CRAFT_PART_INSTALL}/bin"
      x86_64-w64-mingw32-gcc -Wall -Wextra -Werror -O2 \
        "${CRAFT_PART_SRC}/wait-for-window.c" -o "${CRAFT_PART_INSTALL}/bin/wait-for-window.exe" -luser32
      rm "${CRAFT_PART_INSTALL}/wait-for-window.c"
    organize:
      "*.sh": bin/
      pulse-client.conf: etc/zwift/pulse-client.conf

  version-generator:
    plugin: nil
    source: .
    # A local source is checked for changes on every run, so this part is rebuilt each time and
    # the version stays current. A git source would never be rebuilt.
    source-type: local
    # Set the snap version from the latest git tag, for example v0.9 gives 0.9 and v0.9-3-g1a2b3c4
    # means 3 commits after that tag. "-dirty" is added when there are uncommitted changes. Without
    # tags the commit hash is used. The local source has no git data, so ask the project directory.
    override-build: |
      craftctl default
      version="$(git -C "${CRAFT_PROJECT_DIR}" describe --tags --always --dirty)" || version="unknown"
      craftctl set version="${version#v}"

  gpu-2604:
    # Helpers for the gpu-2604 content interface. Pruning is done after all
    # other parts staged their libraries so nothing shadows the mesa provider.
    after: [runtime-prune]
    plugin: dump
    source: https://github.com/canonical/gpu-snap.git
    source-type: git
    source-commit: 84e56217ec137c3f8d7a0e773bb7c39c8fc40f28
    override-prime: |
      craftctl default
      "${CRAFT_PART_SRC}/bin/gpu-2604-cleanup" mesa-2604
    prime:
      - bin/gpu-2604-wrapper
