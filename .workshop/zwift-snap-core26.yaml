name: zwift-snap-core26
base: ubuntu@26.04
sdks:
  # Carries the desktop plug of the workshop, defined in .workshop/zwift-dev-gui/sdk.yaml.
  # The yarf smoke test (tests/smoke.sh) renders its Mir compositor on the host display
  # through it when one is available.
  - name: project-zwift-dev-gui
connections:
  # The desktop interface is not connected automatically at launch, spell it out here.
  - plug: project-zwift-dev-gui:desktop
    slot: system:desktop
actions:
  setup: |
    # snapcraft is installed from the snap store, destructive mode builds in this workshop.
    # pkgproxy caches package downloads (apt, snaps) so repeated builds skip the download.
    if ! snap list pkgproxy > /dev/null 2>&1; then
      sudo snap install pkgproxy
    fi
    # wait for the proxy daemon before pointing apt and snapd at it
    for _ in $(seq 30); do
      pkgproxy.pkgproxyctl stats > /dev/null 2>&1 && break
      sleep 1
    done
    pkgproxy.pkgproxyctl stats > /dev/null
    # point snapd at the proxy first, so the snapcraft download below is cached too
    pkgproxy.pkgproxyctl setup snap | sudo sh
    if ! snap list snapcraft > /dev/null 2>&1; then
      sudo snap install snapcraft --classic
    fi
    # apt caches http:// sources only, hence the plain-http WineHQ url in snapcraft.yaml
    pkgproxy.pkgproxyctl setup apt | sudo sh
    sudo apt-get install -y shellcheck yamllint
  stats: |
    # what pkgproxy has cached and how much downloading it saved
    pkgproxy.pkgproxyctl stats
  build: |
    cd /project
    sudo snapcraft pack --destructive-mode "$@"
  clean: |
    cd /project
    sudo snapcraft clean --destructive-mode
  install: |
    cd /project
    # pass --devmode to install the strict snap without confinement, for debugging
    sudo snap install --dangerous "$@" ./zwift_*_amd64.snap
  test: |
    cd /project
    tests/run-tests.sh
  smoke: |
    cd /project
    # Visual smoke test with yarf: starts a Mir compositor, runs the zwift launcher
    # against it and checks on screen that Zwift gets installed and starts. The first
    # run downloads Zwift and can take half an hour, later runs are quick.
    tests/smoke.sh "$@"
  size: |
    cd /project
    du -sh prime/* 2>/dev/null | sort -rh
    du -sh prime/opt/wine-devel/* 2>/dev/null | sort -rh
    du -sh prime/usr/lib/x86_64-linux-gnu/* 2>/dev/null | sort -rh | head -20
    ls -l --block-size=M ./zwift_*_amd64.snap
  lint: |
    cd /project
    shellcheck -x launcher/*.sh snap/prune-closure.sh tests/run-tests.sh tests/smoke.sh tests/scenarios.sh tests/stubs/*
    yamllint -d '{extends: relaxed, rules: {line-length: {max: 140}}}' \
      snap/snapcraft.yaml .workshop/zwift-snap-core26.yaml .workshop/zwift-dev-gui/sdk.yaml
