name: zwift-snap
base: ubuntu@26.04
sdks:
  # pkgproxy SDK: installs and configures pkgproxy early, warms cache with local snaps.
  # Must be listed before zwift-snap-sdk so pkgproxy is configured before other snaps install.
  - name: project-pkgproxy
  # Carries the desktop plug of the workshop, defined in .workshop/zwift-snap-sdk/sdk.yaml.
  # The yarf smoke test (tests/smoke.sh) renders its Mir compositor on the host display
  # through it when one is available.
  - name: project-zwift-snap-sdk
  # Rust SDK for building and testing the zwift-gui launcher
  - name: rust
    channel: latest/stable
connections:
  # The desktop interface is not connected automatically at launch, spell it out here.
  # References use the bare SDK name: the project- prefix of the sdks entry only
  # selects the source and is not part of the name.
  - plug: zwift-snap-sdk:desktop
    slot: system:desktop
  - plug: zwift-snap-sdk:gpu
    slot: system:gpu
actions:
  stats: |
    # what pkgproxy has cached and how much downloading it saved
    pkgproxy.pkgproxyctl stats
  build: |
    cd /project
    sudo snapcraft pack --destructive-mode "$@"
  clean: |
    cd /project
    sudo snapcraft clean --destructive-mode
  install: |
    cd /project
    # Build timestamps, not version strings, identify the latest local artifact.
    newest=""
    for candidate in ./zwift_*_amd64.snap; do
      [[ -f ${candidate} ]] || continue
      if [[ -z ${newest} || ${candidate} -nt ${newest} ]]; then
        newest="${candidate}"
      fi
    done
    if [[ -z ${newest} ]]; then
      echo "No Zwift snap found in /project; run workshop run build first." >&2
      exit 1
    fi
    echo "Installing ${newest}"
    # pass --devmode to install the strict snap without confinement, for debugging
    sudo snap install --dangerous "$@" "${newest}"
  lint: |
    cd /project
    shellcheck -x launcher/*.sh snap/prune-closure.sh tests/smoke.sh tests/gtk-preview.sh \
      tests/bluetooth.sh tests/pairing.sh tests/tools/yarf/yarf.sh tests/tools/bluetooth/*.sh \
      tests/unit/*.bats tests/unit/test_helper.bash \
      .workshop/zwift-snap-sdk/hooks/*
    python3 -m py_compile tests/zwift-stub.py tests/tools/yarf/*.py tests/tools/bluetooth/*.py \
      .workshop/zwift-snap-sdk/workshop
    yamllint -d '{extends: relaxed, rules: {line-length: {max: 140}}}' \
      snap/snapcraft.yaml .workshop/zwift-snap.yaml .workshop/zwift-snap-sdk/sdk.yaml
    cargo fmt --manifest-path launcher-gui/Cargo.toml --check
    cargo clippy --manifest-path launcher-gui/Cargo.toml --features gtk-ui --all-targets -- -D warnings
  test: |
    cd /project
    bats tests/unit
    cargo test --manifest-path launcher-gui/Cargo.toml --features gtk-ui
  gtk-preview: |
    cd /project
    # Visual tests of the GTK launcher and stub-Wine lifecycle; no real Zwift.
    bash tests/gtk-preview.sh
  smoke: |
    cd /project
    # Visual smoke test with yarf: starts a Mir compositor, runs the zwift launcher
    # against it and checks installation reaches the mandatory login gate, without
    # credentials. The first run downloads Zwift and can take half an hour.
    tests/smoke.sh "$@"
  bluetooth: |
    cd /project
    # Bluetooth plumbing test with the BlueZ D-Bus mock bluezoo: checks that
    # winebth inside the confined snap reaches BlueZ over the bluez plug, sees
    # the mock adapters and its authentication agent, and learns about a
    # discovered peer device. Needs the snap to be installed beforehand.
    tests/bluetooth.sh "$@"
  pairing: |
    cd /project
    # Reaches Zwift's device pairing screen without a Zwift account: fakes the
    # Zwift login servers (tests/zwift-stub.py), runs the bluezoo Bluetooth mock,
    # logs in with a fake token, and pairs the trainer with yarf.
    # Needs the snap installed and Zwift downloaded into the prefix (run the
    # smoke test once first).
    tests/pairing.sh "$@"
  yarf: |
    cd /project
    # Debugging helpers that drive and screenshot a running Mir compositor (such as the
    # one the smoke or pairing test starts), using yarf's own wayland clients. Examples:
    #   workshop run zwift-snap yarf screenshot -s wayland-99 ~/shot.png
    #   workshop run zwift-snap yarf input type offline@example.com then key Return
    tests/tools/yarf/yarf.sh "$@"
  size: |
    cd /project
    du -sh prime/* 2>/dev/null | sort -rh
    du -sh prime/opt/wine-devel/* 2>/dev/null | sort -rh
    du -sh prime/usr/lib/x86_64-linux-gnu/* 2>/dev/null | sort -rh | head -20
    ls -l --block-size=M ./zwift_*_amd64.snap
